name = "atlas-first-app"
main = "./worker/index.js"
compatibility_date = "2026-10-10"
workers_dev = true

[assets]
directory = "./build"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "QUIZ_ROOM"
class_name = "QuizRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuizRoom"]

[observability]
enabled = true
